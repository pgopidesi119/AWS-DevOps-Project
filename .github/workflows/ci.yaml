name: Product Catalog CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  gitops-image-tags:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check shell syntax
        run: sh -n scripts/publish-images-to-ecr.sh scripts/update-argocd-image-tags.sh

      - name: Test ArgoCD image tag updates
        run: python3 -m unittest discover -s test -p 'test_update_argocd_image_tags.py'

  product-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: src/product-catalog/go.mod
          cache-dependency-path: src/product-catalog/go.sum

      - name: Build
        working-directory: src/product-catalog
        run: go build ./...

      - name: Test
        working-directory: src/product-catalog
        run: go test ./...
