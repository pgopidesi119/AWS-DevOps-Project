apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://raw.githubusercontent.com/open-telemetry/opentelemetry-demo/91356a39d5a0dc601317b55339b7abfafd91b481/kubernetes/opentelemetry-demo.yaml
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: accounting
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: "ghcr.io/open-telemetry/demo:2.0.2-accounting" # ci-image:accounting
